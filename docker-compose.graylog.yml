# Integração opcional com o Graylog (projeto C:\Workspace\graylog). Requer o Graylog de pé antes.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.graylog.yml up -d
#
# O stdout/stderr dos containers vai pelo Docker logging driver GELF (UDP) para a porta publicada do Graylog.
# Use 127.0.0.1 (não "localhost"): o daemon resolve localhost para ::1 (IPv6) e a porta é publicada só em IPv4.
# A "tag" vira o campo service_name no pipeline do Graylog e leva ao stream "SonarQube - Infra".
services:
  sonarqube:
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: sonarqube

  postgres:
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: sonarqube-db
